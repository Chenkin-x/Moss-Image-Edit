<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">MOSS Image Edit</title>
  <desc id="desc">Reference. Instruct. Edit. A green editing toolkit banner with two illustrated landscape cards showing an imagined change of sky. This is a workflow illustration, not a model result.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#33583e"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020b06" flood-opacity=".32"/></filter>
    <clipPath id="refclip"><rect x="712" y="69" width="184" height="161" rx="10"/></clipPath>
    <clipPath id="editclip"><rect x="972" y="103" width="216" height="166" rx="10"/></clipPath>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#a4d08b" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="1278" height="378" rx="22" fill="#102018" stroke="#2e4936"/>
  <rect x="638" y="22" width="614" height="336" rx="12" fill="url(#grid)" opacity=".7"/>
  <ellipse cx="982" cy="192" rx="246" ry="142" fill="#304f34" opacity=".65"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <circle cx="63" cy="48" r="5" fill="#a4d08b"/>
    <text x="80" y="53" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.8" fill="#a0b79e">MOSS-IMAGE / EDITING TOOLKIT</text>
    <text x="54" y="151" font-size="86" font-weight="800" letter-spacing="-4" fill="#e6f0df">MOSS</text>
    <text x="54" y="231" font-size="76" font-weight="500" letter-spacing="-3" fill="#e6f0df">Image Edit<tspan fill="#a4d08b">.</tspan></text>
    <text x="58" y="276" font-size="21" letter-spacing=".4" fill="#a0b79e">Reference. Instruct. Edit.</text>
    <g font-family="ui-monospace, monospace" font-size="12" fill="#d2e6c5">
      <rect x="56" y="315" width="72" height="28" rx="14" fill="#263d2c"/><text x="76" y="334">LoRA</text>
      <rect x="138" y="315" width="117" height="28" rx="14" fill="#263d2c"/><text x="154" y="334">FA4 VARLEN</text>
      <rect x="265" y="315" width="91" height="28" rx="14" fill="#263d2c"/><text x="282" y="334">ZeRO-2</text>
    </g>
    <g transform="rotate(-7 804 169)">
      <rect x="700" y="57" width="208" height="224" rx="17" fill="#1d3427" stroke="#45634b" filter="url(#shadow)"/>
      <g clip-path="url(#refclip)">
        <rect x="712" y="69" width="184" height="161" fill="#365e50"/>
        <circle cx="852" cy="109" r="19" fill="#efdfb3"/>
        <path d="M700 205 762 121 813 190 854 150 917 217V241H700Z" fill="#63866a"/>
        <path d="M700 217Q754 175 805 213T920 187V242H700Z" fill="#254538"/>
        <path d="M764 164 777 143 790 162 780 159 775 166Z" fill="#365e50" opacity=".8"/>
      </g>
      <circle cx="721" cy="255" r="4" fill="#a4d08b"/>
      <text x="733" y="260" font-size="13" font-weight="600" letter-spacing="1.5" fill="#e6f0df">REFERENCE</text>
    </g>
    <path d="M920 152Q947 147 953 184" stroke="#a4d08b" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <g transform="rotate(5 1080 198)">
      <rect x="960" y="91" width="240" height="224" rx="17" fill="#1d3427" stroke="#45634b" filter="url(#shadow)"/>
      <g clip-path="url(#editclip)">
        <rect x="972" y="103" width="216" height="166" fill="#555469"/>
        <circle cx="1137" cy="144" r="22" fill="#efdfb3"/>
        <path d="M958 245 1031 158 1091 229 1139 188 1212 256V280H958Z" fill="#63866a"/>
        <path d="M958 256Q1022 212 1081 251T1215 225V282H958Z" fill="#254538"/>
        <path d="M1033 202 1048 181 1063 201 1051 196 1045 205Z" fill="#555469" opacity=".8"/>
      </g>
      <path d="m979 286 3-7 3 7 7 3-7 3-3 7-3-7-7-3Z" fill="#a4d08b"/>
      <text x="998" y="294" font-size="13" font-weight="600" letter-spacing="1.5" fill="#e6f0df">YOUR EDIT</text>
    </g>
    <rect x="716" y="315" width="232" height="30" rx="15" fill="#263d2c" stroke="#45634b"/>
    <text x="733" y="335" font-size="13" fill="#d2e6c5">+ a new sky, the same scene</text>
    <text x="1196" y="359" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.5" fill="#a0b79e">WORKFLOW ILLUSTRATION</text>
  </g>
</svg>
