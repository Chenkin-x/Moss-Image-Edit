<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="810" viewBox="0 0 1400 810" role="img" aria-labelledby="title desc">
<title id="title">MOSS-Image-Edit — attention visibility and reference KV reuse</title>
<desc id="desc">Reference queries attend only reference keys and values. Text and target queries attend all three groups. At inference, the reference branch runs once at fixed time zero to create K/V for every layer. All subsequent denoising steps read those layer-matched keys and values while updating text and target tokens.</desc>
