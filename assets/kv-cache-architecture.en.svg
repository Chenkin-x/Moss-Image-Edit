<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1090" viewBox="0 0 1400 1090" role="img" aria-labelledby="title desc">
<title id="title">MOSS-Image-Edit — token flow and time conditioning</title>
<desc id="desc">Three token groups are arranged as text, reference and target. Each follows a separate vertical encoding path into the shared MOSS Transformer. Red timestep inputs are t for text, zero for reference and t for target. The backbone uses the corresponding modulation at every layer, and outputs target velocity only.</desc>
