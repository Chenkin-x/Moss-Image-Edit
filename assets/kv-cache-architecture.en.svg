<marker id="time" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M2 1.5 L7 4.5 L2 7.5" fill="none" stroke="#ce6266" stroke-width="1.5"/></marker>
<marker id="cache" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M2 1.5 L7 4.5 L2 7.5" fill="none" stroke="#528463" stroke-width="1.5"/></marker>
